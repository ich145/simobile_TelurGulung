<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/product-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Keranjang</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let item of cartItems">
      <ion-label>
        <h2>{{ item.product.nama }}</h2>
        <p>Rp{{ item.product.hargaJual }}</p>
      </ion-label>

      <ion-buttons slot="end">
        <ion-button (click)="kurangQty(item.product.id)">-</ion-button>
        <ion-note>{{ item.quantity }}</ion-note>
        <ion-button (click)="tambahQty(item.product.id)" [disabled]="item.product.stok <= 0">+</ion-button>
        <ion-button color="danger" (click)="hapusItem(item.product.id)">Hapus</ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>

  <ion-item *ngIf="cartItems.length === 0">
    <ion-label>Keranjang masih kosong</ion-label>
  </ion-item>

  <ion-item>
    <ion-label><strong>Total</strong></ion-label>
    <ion-note slot="end">Rp{{ getTotal() }}</ion-note>
  </ion-item>

  <ion-button id="btnCheckout" expand="block" [disabled]="getCartItems().length === 0" (click)="checkout()">
    Konfirmasi Transaksi
  </ion-button>

  <ion-alert trigger="btnCheckout" header="Berhasil" message="Transaksi berhasil disimpan ke riwayat."
    [buttons]="alertButtons">
  </ion-alert>

  <ion-button expand="block" fill="outline" routerLink="/transaction-history">
    Lihat Riwayat Transaksi
  </ion-button>
</ion-content>
