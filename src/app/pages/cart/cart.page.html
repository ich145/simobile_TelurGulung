<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Cart</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let item of cartItems">
      <ion-label>
        <h2>{{ item.product.nama }}</h2>
        <p>
          Rp{{ item.product.hargaJual }}
        </p>
        <p>
          Jumlah: {{ item.quantity }}
        </p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-item>
    <ion-label>
      <strong>Total</strong>
    </ion-label>
    <ion-note slot="end">
      Rp{{ total }}
    </ion-note>
  </ion-item>
</ion-content>
